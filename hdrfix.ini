[hdrfix]
; 1 = convert HDR screen captures to SDR. 0 = do nothing (TeamSpeak behaves as if the DLL were absent).
enabled=1

; SDR white level in nits. 0 = follow the Windows "SDR content brightness" slider live (recommended).
sdr_white_override_nits=0

; Where the highlight roll-off starts, relative to SDR white (0..1).
; 0.75 (default): colors below the knee pass through exactly; above it the curve compresses,
;     so HDR highlights (HDR games and videos) keep some detail and their colors, but white UI
;     comes out slightly dimmer (255 -> about 240).
; 1 = no roll-off: desktop and apps come out exactly as on screen, but HDR highlights brighter
;     than SDR white clip to plain white.
knee=0.75

; Monitor peak brightness in nits, used as the top of the roll-off. 0 = use what Windows reports.
peak_override_nits=0

; 1 = also fix sharing a single app/window (TeamSpeak captures those with GDI, which clips HDR-rendered
; windows such as Chrome). 0 = only fix full-screen sharing.
fix_window_capture=1

; 1 = write hdrfix.log next to the DLL (or to %TEMP% if that folder isn't writable).
log=1

; 1 = also log one line per second while TeamSpeak captures (what it captured, what hdrfix did).
; For troubleshooting only: it makes the log grow quickly.
verbose_log=0
