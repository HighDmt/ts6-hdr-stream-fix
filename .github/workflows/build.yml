# Builds the DLL on every push / pull request and uploads the release layout as an artifact.
# Pushing a tag like v1.0.0 also publishes a GitHub release with the zip attached.
# (hdrtest can't run here: CI machines have no HDR monitor.)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # only used by the release step, on tags
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "hdrfix-$env:GITHUB_REF_NAME" } else { "hdrfix-dev" }
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: hdrfix
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" --title "hdrfix $env:GITHUB_REF_NAME" --generate-notes
